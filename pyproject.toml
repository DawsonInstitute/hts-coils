[project]
name = "hts-coils"
version = "0.0.1"
description = "High-temperature superconducting coil modeling"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "Unlicense" }
authors = [ { name = "arcticoder" } ]

dependencies = [
	"numpy>=1.24",
	"scipy>=1.10",
	"matplotlib>=3.6",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.6"]
test = ["pytest>=7.0"]
opt = ["scikit-optimize>=0.9.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["hts*"]   # add "warp" explicitly only if it should be installable
exclude = ["warp.optimizer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["src/warp/optimizer", ".venv", "papers", "notebooks"]
