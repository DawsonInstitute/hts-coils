name: notebooks
on:
  push:
  pull_request:
jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # catches a broken .gitmodules / orphaned gitlink (what mybinder does)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: binder/requirements.txt
      - run: pip install -r binder/requirements.txt nbmake pytest
      - name: Execute all notebooks
        env:
          MPLBACKEND: Agg
        run: pytest --nbmake --nbmake-timeout=600 -p no:cacheprovider notebooks/
      - name: Unit tests
        run: pip install -e . && pytest tests -q
